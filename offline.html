<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIVO App Foundation - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #000000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 40px;
      height: 40px;
      fill: white;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #111;
    }
    p {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    button {
      background: #000000;
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.28 3.28a.75.75 0 011.06-.06l17.38 15.38a.75.75 0 01-1 1.12L2.34 4.34a.75.75 0 01-.06-1.06zM9.75 8.5a3.25 3.25 0 016.5 0c0 1.1-.55 2.08-1.38 2.67l-1.12-.99a1.75 1.75 0 10-2.5-2.43l-1.5-1.25zM12 4.25a4.75 4.75 0 00-4.75 4.75c0 .9.25 1.74.69 2.46l-1.1-.98A6.23 6.23 0 015.75 9 6.25 6.25 0 0112 2.75c1.45 0 2.79.5 3.85 1.33l-1.1.98A4.72 4.72 0 0012 4.25zM18.25 9c0 1.15-.31 2.23-.86 3.16l-1.1-.98c.36-.65.57-1.39.57-2.18 0-2.62-2.13-4.75-4.75-4.75-.8 0-1.55.2-2.21.55l-1.1-.98A6.22 6.22 0 0112 2.75 6.25 6.25 0 0118.25 9zM12 12.75a3.25 3.25 0 01-3.25-3.25c0-.36.06-.7.17-1.02l4.1 3.63c-.3.4-.64.64-1.02.64zM12 21.25a.75.75 0 01-.75-.75v-6a.75.75 0 011.5 0v6a.75.75 0 01-.75.75z"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>It looks like you've lost your internet connection. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
