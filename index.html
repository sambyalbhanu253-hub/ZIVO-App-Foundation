// GenMB auth SDK (Capability)
(function() {
class GenMBGoogleAuth {
  constructor({ appId, baseUrl, onError }) {
    if (!appId) {
      throw new Error('GenMBGoogleAuth: appId is required')
    }

    this.appId = appId
    this.baseUrl = (baseUrl || '/api/auth/google').replace(/\/$/, '')
    this.user = null
    this.listeners = []
    this.onError = onError || console.error
    this._ready = false
    this._readyPromise = null
    this._refreshTimer = null
  }

  async ready() {
    if (this._ready) return this
    if (this._readyPromise) return this._readyPromise

    var self = this
    this._readyPromise = this.checkSession().then(function () {
      if (!self.user) {
        var params = new URLSearchParams(window.location.search)
        var magicToken = params.get('magic_token')
        if (magicToken) {
          return self.verifyMagicLink(magicToken).catch(function () {
          }).then(function () {
            params.delete('magic_token')
            var cleanUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '') + window.location.hash
            window.history.replaceState({}, '', cleanUrl)
          })
        }
      }
    }).then(function () {
      self._ready = true
      return self
    })
    return this._readyPromise
  }

  async signIn() {
    return new Promise((resolve, reject) => {
      let settled = false

      var width = 500
      var height = 600
      var left = window.screenX + (window.outerWidth - width) / 2
      var top = window.screenY + (window.outerHeight - height) / 2

      var navBase = this.baseUrl
      var extraOrigin = ''
      var host = window.location.hostname || ''
      if (/^preview-\d+-/.test(host) && host.slice(-10) === '.genmb.com') {
        navBase = 'https://' + host.split('.').slice(-2).join('.') + '/api/auth/google'
        extraOrigin = '&origin=' + encodeURIComponent(window.location.origin)
      }

      var popup = window.open(
        navBase + '/authorize?app_id=' + encodeURIComponent(this.appId) + '&redirect=popup' + extraOrigin,
        'genmb-google-signin',
        'width=' + width + ',height=' + height + ',left=' + left + ',top=' + top + ',popup=1'
      )

      if (!popup || popup.closed) {
        window.location.href = navBase + '/authorize?app_id=' + encodeURIComponent(this.appId) + '&redirect=' + encodeURIComponent(window.location.href) + extraOrigin
        resolve(null)
        return
      }

      var pollSession = null

      var cleanup = function () {
        clearTimeout(timeout)
        clearInterval(checkClosed)
        if (pollSession) clearInterval(pollSession)
        window.removeEventListener('message', handleMessage)
      }

      var self = this

      var finishWithUser = function (user) {
        if (settled) return
        settled = true
        cleanup()
        try { popup.close() } catch (e) { }
        resolve(user)
      }

      var timeout = setTimeout(function () {
        if (settled) return
        settled = true
        cleanup()
        try { popup.close() } catch (e) { }
        var error = new Error("Sign-in took too long. Please try again.")
        error.code = 'SIGN_IN_TIMEOUT'
        self.onError(error)
        reject(error)
      }, 120000)

      var handleMessage = function (event) {
        var origin = event.origin
        var isGenmb = origin === 'https://genmb.com' || origin.endsWith('.genmb.com')
        var isLocalhost = origin.startsWith('http://localhost') || origin.startsWith('http://127.0.0.1')
        if (!isGenmb && !isLocalhost) return
        if (settled) return

        if (event.data && event.data.error) {
          settled = true
          cleanup()
          var error = new Error(event.data.error)
          error.code = 'SIGN_IN_FAILED'
          self.onError(error)
          reject(error)
        } else if (event.data && event.data.user) {
          self.user = event.data.user
          self._notifyListeners()
          self._startRefreshTimer()
          finishWithUser(self.user)
        }
      }

      var checkingSession = false
      var pollStartedAt = Date.now()
      var pollTick = function () {
        if (settled || checkingSession) return
        checkingSession = true
        self.checkSession().then(function (user) {
          checkingSession = false
          if (user && !settled) finishWithUser(user)
        }).catch(function () { checkingSession = false })
      }
      pollSession = setInterval(function () {
        pollTick()
        if (!settled && pollSession && Date.now() - pollStartedAt >= 30000) {
          clearInterval(pollSession)
          pollSession = setInterval(pollTick, 5000)
        }
      }, 1500)

      var checkClosed = setInterval(function () {
        var closed = false
        try { closed = popup.closed } catch (e) { closed = false }
        if (!closed || settled) return
        self.checkSession().then(function (user) {
          if (settled) return
          if (user) finishWithUser(user)
          else { settled = true; cleanup(); resolve(null) }
        }).catch(function () {
          if (settled) return
          settled = true; cleanup(); resolve(null)
        })
      }, 500)

      window.addEventListener('message', handleMessage)
    })
  }

  async sendMagicLink(email) {
    try {
      var res = await fetch('/api/auth/email/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, app_id: this.appId }),
        credentials: 'include'
      })
      return await res.json()
    } catch (err) {
      var error = new Error("We couldn't send the sign-in link. Check your connection and try again.")
      error.code = 'NETWORK_ERROR'
      this.onError(error)
      throw error
    }
  }

  async verifyMagicLink(token) {
    try {
      var res = await fetch(
        '/api/auth/email/verify?token=' + encodeURIComponent(token) + '&app_id=' + encodeURIComponent(this.appId),
        { credentials: 'include' }
      )
      if (!res.ok) {
        var error = new Error("This sign-in link has expired or already been used. Send yourself a new one.")
        error.code = 'VERIFY_FAILED'
        this.onError(error)
        return null
      }
      var data = await res.json()
      if (data.success && data.user) {
        this.user = data.user
        this._notifyListeners()
        this._startRefreshTimer()
      }
      return this.user
    } catch (err) {
      var error = new Error("We couldn't sign you in. Check your connection and try again.")
      error.code = 'NETWORK_ERROR'
      this.onError(error)
      return null
    }
  }

  async signUp(email, password, name) {
    try {
      var res = await fetch('/api/auth/password/signup-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, name: name || null, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success) {
        var err = new Error(data.error || 'Sign-up failed')
        err.code = 'SIGNUP_FAILED'
        this.onError(err)
        throw err
      }
      return data
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  async verifySignUp(email, code) {
    try {
      var res = await fetch('/api/auth/password/signup-verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, code: code, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success || !data.user) {
        var err = new Error(data.error || 'Verification failed')
        err.code = 'SIGNUP_FAILED'
        this.onError(err)
        throw err
      }
      this.user = data.user
      this._notifyListeners()
      this._startRefreshTimer()
      return this.user
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  async signInWithPassword(email, password) {
    try {
      var res = await fetch('/api/auth/password/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success || !data.user) {
        var err = new Error(data.error || 'Invalid email or password')
        err.code = 'LOGIN_FAILED'
        this.onError(err)
        throw err
      }
      this.user = data.user
      this._notifyListeners()
      this._startRefreshTimer()
      return this.user
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  async requestPasswordReset(email) {
    try {
      var res = await fetch('/api/auth/password/reset-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, app_id: this.appId }),
        credentials: 'include',
      })
      return await res.json()
    } catch (err) {
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  async confirmPasswordReset(email, code, newPassword) {
    try {
      var res = await fetch('/api/auth/password/reset-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, code: code, newPassword: newPassword, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success) {
        var err = new Error(data.error || 'Password reset failed')
        err.code = 'RESET_FAILED'
        this.onError(err)
        throw err
      }
      return data
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  async signOut() {
    this._stopRefreshTimer()

    try {
      await fetch(this.baseUrl + '/signout?app_id=' + encodeURIComponent(this.appId), {
        method: 'POST',
        credentials: 'include'
      })
    } catch (err) {
      err.code = 'NETWORK_ERROR'
      this.onError(err)
    }

    this.user = null
    this._notifyListeners()
  }

  async checkSession() {
    try {
      var res = await fetch(this.baseUrl + '/session?app_id=' + encodeURIComponent(this.appId), {
        credentials: 'include'
      })

      if (res.ok) {
        this.user = (await res.json()) || null
        this._notifyListeners()
        if (!this.user) {
          this._stopRefreshTimer()
          return null
        }
        this._startRefreshTimer()
        this._refreshSession()
        return this.user
      }
      this._stopRefreshTimer()
      return null
    } catch (err) {
      err.code = 'NETWORK_ERROR'
      this.onError(err)
      return null
    }
  }

  getUser() {
    return this.user
  }

  isAuthenticated() {
    return this.user !== null
  }

  onAuthStateChange(callback) {
    this.listeners.push(callback)
    callback(this.user)
    var self = this
    return function () {
      self.listeners = self.listeners.filter(function (l) { return l !== callback })
    }
  }

  _refreshSession() {
    fetch(this.baseUrl + '/refresh?app_id=' + encodeURIComponent(this.appId), {
      method: 'POST',
      credentials: 'include'
    }).catch(function () {
    })
  }

  _startRefreshTimer() {
    this._stopRefreshTimer()
    var self = this
    this._refreshTimer = setInterval(function () {
      if (self.user) {
        self._refreshSession()
      }
    }, 30 * 60 * 1000)
  }

  _stopRefreshTimer() {
    if (this._refreshTimer) {
      clearInterval(this._refreshTimer)
      this._refreshTimer = null
    }
  }

  _notifyListeners() {
    var self = this
    this.listeners.forEach(function (listener) {
      try {
        listener(self.user)
      } catch (err) {
        console.error('Error in auth state listener:', err)
      }
    })
  }
}

(function() {
class GenMBBilling {
  constructor({ appId, baseUrl, billingToken, onError } = {}) {
    if (!appId) throw new Error('GenMBBilling: appId is required')
    if (!billingToken) throw new Error('GenMBBilling: billingToken is required')
    this.appId = appId
    this.baseUrl = ((baseUrl || '/api/billing').replace(/\/$/, '')) + '/' + appId
    this.token = billingToken
    this.customer = null
    this.listeners = []
    this.onError = onError || (function (e) { console.error('[genmb.billing]', e) })
    this._ready = false
    this._readyPromise = null
  }

  async ready() {
    if (this._ready) return this
    if (this._readyPromise) return this._readyPromise
    var self = this
    this._readyPromise = this._refreshCustomer().then(function () {
      self._ready = true
      try {
        var params = new URLSearchParams(window.location.search)
        var sid = params.get('session_id')
        if (sid) {
          self._notify({ type: 'checkout_return', sessionId: sid })
          params.delete('session_id')
          var cleanUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '') + window.location.hash
          window.history.replaceState({}, '', cleanUrl)
        }
      } catch (_) {}
      return self
    })
    return this._readyPromise
  }

  getCustomer() { return this.customer }

  onCustomerChange(callback) {
    if (typeof callback !== 'function') return function () {}
    this.listeners.push(callback)
    try { callback(this.customer) } catch (_) {}
    var self = this
    return function () {
      self.listeners = self.listeners.filter(function (l) { return l !== callback })
    }
  }

  async checkout(opts) {
    var args = opts || {}
    var amountCents = this._toCents(args.amount)
    var body = {
      amount_cents: amountCents,
      currency: (args.currency || 'usd').toLowerCase(),
      product_name: args.productName || 'Purchase',
      success_url: args.successUrl || this._defaultSuccessUrl(),
      cancel_url: args.cancelUrl || window.location.href,
      end_user_email: args.endUserEmail || null,
      metadata: args.metadata || null,
    }
    var data = await this._fetch('/checkout', body)
    if (args.redirect !== false && data.url) {
      window.location.href = data.url
    }
    return data
  }

  async subscribe(opts) {
    var args = opts || {}
    var body = {
      success_url: args.successUrl || this._defaultSuccessUrl(),
      cancel_url: args.cancelUrl || window.location.href,
      price_id: args.priceId || null,
      amount_cents: args.amount != null ? this._toCents(args.amount) : null,
      currency: args.currency || (args.amount != null ? 'usd' : null),
      interval: args.interval || null,
      product_name: args.productName || null,
    }
    var data = await this._fetch('/subscribe', body)
    if (args.redirect !== false && data.url) {
      window.location.href = data.url
    }
    return data
  }

  async openPortal(opts) {
    var args = opts || {}
    var body = { return_url: args.returnUrl || window.location.href }
    var data = await this._fetch('/portal', body)
    if (args.redirect !== false && data.url) {
      window.location.href = data.url
    }
    return data
  }

  async reportUsage(opts) {
    var args = opts || {}
    return this._fetch('/usage', {
      subscription_item_id: args.subscriptionItemId,
      quantity: args.quantity,
      timestamp: args.timestamp || null,
      action: args.action || 'increment',
    })
  }

  async verifySession(sessionId) {
    var resp
    try {
      resp = await fetch(this.baseUrl + '/session/' + encodeURIComponent(sessionId), {
        method: 'GET',
        credentials: 'include',
        headers: { 'X-Billing-Token': this.token },
      })
    } catch (e) {
      var nerr = new Error((e && e.message) || "Check your internet connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      throw nerr
    }
    var json = null
    try { json = await resp.json() } catch (_) {}
    if (!resp.ok) {
      var err = new Error((json && json.error_message) || resp.statusText || "Something went wrong. Please try again.")
      err.code = (json && json.error_code) || 'NETWORK_ERROR'
      err.status = resp.status
      throw err
    }
    return (json && json.data) || {}
  }

  async _refreshCustomer() {
    try {
      var res = await fetch(this.baseUrl + '/customer', {
        method: 'GET',
        credentials: 'include',
        headers: { 'X-Billing-Token': this.token },
      })
      if (!res.ok) {
        this.customer = null
        return
      }
      var json = await res.json()
      var data = (json && json.data) || null
      if (data && data.exists === false) {
        this.customer = null
      } else {
        this.customer = data
      }
      this._notify(this.customer)
    } catch (_) {
      this.customer = null
    }
  }

  _notify(payload) {
    for (var i = 0; i < this.listeners.length; i++) {
      try { this.listeners[i](payload) } catch (e) { this.onError(e) }
    }
  }

  _toCents(amount) {
    if (typeof amount !== 'number' || !isFinite(amount) || amount <= 0) {
      var err = new Error("The amount has to be a positive number.")
      err.code = 'AMOUNT_INVALID'
      throw err
    }
    return Math.round(amount * 100)
  }

  _defaultSuccessUrl() {
    var url = window.location.origin + window.location.pathname
    return url + '?session_id={CHECKOUT_SESSION_ID}'
  }

  async _fetch(path, body) {
    var resp
    try {
      resp = await fetch(this.baseUrl + path, {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          'X-Billing-Token': this.token,
        },
        body: JSON.stringify(body || {}),
      })
    } catch (e) {
      var nerr = new Error((e && e.message) || "Check your internet connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      throw nerr
    }
    var json = null
    try { json = await resp.json() } catch (_) {}
    if (!resp.ok) {
      var detail = json && json.detail
      if (Array.isArray(detail)) {
        detail = detail.map(function (d) {
          var loc = d && Array.isArray(d.loc) ? d.loc.filter(function (p) { return p !== 'body' }).join('.') : ''
          return (loc ? loc + ': ' : '') + ((d && d.msg) || '')
        }).join('; ')
      }
      var message = (json && (json.error_message || json.error)) || (typeof detail === 'string' && detail) || ''
      var code = json && (json.error_code || json.code)
      if (!code && resp.status >= 400 && resp.status < 500) {
        code = resp.status === 422 ? 'VALIDATION_ERROR' : 'HTTP_' + resp.status
      }
      var err = new Error(message || resp.statusText || "Something went wrong. Please try again.")
      err.code = code || 'NETWORK_ERROR'
      err.onboardUrl = json && json.data && json.data.onboard_url
      err.status = resp.status
      throw err
    }
    return (json && json.data) || {}
  }
}

          var parts = []
          Object.keys(params).forEach(function (key) {
            parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
          })
          if (parts.length) qs = '?' + parts.join('&')
        }
        return request('GET', base + '/' + name + '/count' + qs)
      },
      createMany: function (records) {
        return request('POST', base + '/' + name + '/bulk', { records: records })
      },
      deleteMany: function (ids) {
        return request('POST', base + '/' + name + '/bulk-delete', { ids: ids })
      },
      subscribe: function (callback) {
        var channel = 'db:' + name
        if (window.genmb && window.genmb.realtime &&
            typeof window.genmb.realtime.subscribe === 'function') {
          return window.genmb.realtime.subscribe(channel, callback)
        }
        var url = realtimeBase + '/subscribe?channel=' + encodeURIComponent(channel)
        var source = new EventSource(url, { withCredentials: true })
        source.onmessage = function (e) {
          try { callback(JSON.parse(e.data)) } catch (_) { callback(e.data) }
        }
        return function () { source.close() }
      }
    }
  }

  async _request(method, url, body) {
    var attempt = 0
    var provisionAttempt = 0
    while (true) {
      var controller = new AbortController()
      var timer = setTimeout(function () { controller.abort() }, 30000)
      try {
        var options = {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal
        }
        if (body) {
          options.body = JSON.stringify(body)
        }
        var res = await fetch(url, options)
        clearTimeout(timer)
        if (!res.ok) {
          if (res.status >= 500 && attempt < 2) {
            attempt++
            await new Promise(function (r) { setTimeout(r, 300 * attempt) })
            continue
          }
          var errBody = null
          try { errBody = await res.json() } catch (_) {}
          var raw = (errBody && (errBody.error || errBody.detail)) || ('Request failed (HTTP ' + res.status + ')')
          if (/being set up|setting up/i.test(raw) && provisionAttempt < 6) {
            provisionAttempt++
            await new Promise(function (r) { setTimeout(r, Math.min(3000, 800 * provisionAttempt)) })
            continue
          }
          throw _dbError(raw, res.status)
        }
        var result = await res.json()
        if (!result.success) {
          throw _dbError(result.error, res.status)
        }
        return result.data
      } catch (err) {
        clearTimeout(timer)
        if (err.name === 'AbortError') {
          if (attempt < 2) {
            attempt++
            await new Promise(function (r) { setTimeout(r, 300 * attempt) })
            continue
          }
          throw new Error('The database took too long to respond. Please try again.')
        }
        throw err
      }
    }
  }
}

// GenMB realtime SDK (Capability)
(function() {
class GenMBRealtime {
  constructor({ appId, baseUrl } = {}) {
    if (!appId) throw new Error('GenMBRealtime: appId is required')
    this.appId = appId
    this.baseUrl = ((baseUrl || '/api/realtime').replace(/\/$/, '')) + '/' + appId
    this._streams = new Map()
  }
  async ready() { return this }
  subscribe(channel, onMessage) {
    const url = `${this.baseUrl}/subscribe?channel=${encodeURIComponent(channel)}`
    const source = new EventSource(url, { withCredentials: true })
    source.onmessage = (e) => { try { onMessage(JSON.parse(e.data)) } catch (_) { onMessage(e.data) } }
    source.onerror = () => { }
    this._streams.set(channel, source)
    return () => { source.close(); this._streams.delete(channel) }
  }
  async publish(channel, payload) {
    const res = await fetch(`${this.baseUrl}/publish`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ channel, payload }),
    })
    if (!res.ok) {
      const err = await res.json().catch(() => ({}))
      throw Object.assign(new Error(err.error || err.detail || `publish failed (${res.status})`), { code: err.error_code || err.code })
    }
    const json = await res.json()
    return json.data !== undefined ? json.data : json
  }
  presence(channel, onChange) {
    return { unsubscribe: this.subscribe(`${channel}:presence`, onChange) }
  }
}
window.GenMBRealtime = GenMBRealtime

(function() {
class GenMBTranslate {
  constructor({ appId, baseUrl } = {}) {
    if (!appId) throw new Error('GenMBTranslate: appId is required')
    this.appId = appId
    this.baseUrl = ((baseUrl || '/api/translate').replace(/\/$/, '')) + '/' + appId
    this._cache = new Map()
  }
  async ready() { return this }
  async text(input, targetLang, sourceLang) {
    const key = `${input}|${targetLang}|${sourceLang || ''}`
    if (this._cache.has(key)) return this._cache.get(key)
    const result = await this._post('/text', { input, targetLang, sourceLang })
    this._cache.set(key, result)
    return result
  }
  async batch(inputs, targetLang) {
    const list = Array.isArray(inputs) ? inputs : []
    const out = []
    for (let i = 0; i < list.length; i += 10) {
      out.push(...(await this._post('/batch', { inputs: list.slice(i, i + 10), targetLang })))
    }
    return out
  }
  async detect(text) { return this._post('/detect', { text }) }
  async languages() {
    const res = await fetch(this.baseUrl + '/languages', { credentials: 'include' })
    const json = await res.json()
    return json.data !== undefined ? json.data : json
  }
  async _post(path, body) {
    const res = await fetch(this.baseUrl + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body),
    })
    const json = await res.json()
    if (!res.ok) throw Object.assign(new Error(json.error || json.detail || 'translate failed'), { code: json.code })

  }
}

// GenMB voice SDK (Capability)
(function() {
class GenMBVoice {
  constructor({ appId, baseUrl } = {}) {
    if (!appId) throw new Error('GenMBVoice: appId is required')
    this.appId = appId
    this.baseUrl = ((baseUrl || '/api/voice-cloud').replace(/\/$/, '')) + '/' + appId
  }
  async ready() { return this }
  async transcribe(audio, opts = {}) {
    const payload = await this._audioToPayload(audio, opts)
    return this._post('/transcribe', payload)
  }
  async speak(text, opts = {}) { return this._post('/speak', { text, ...opts }) }
  async voices() {
    const res = await fetch(this.baseUrl + '/voices', { credentials: 'include' })
    const json = await res.json()
    return json.data !== undefined ? json.data : json
  }
  async _audioToPayload(audio, extras) {
    if (typeof audio === 'string') return { url: audio, ...extras }
    if (audio instanceof File || audio instanceof Blob) {
      const buf = await audio.arrayBuffer()
      return { base64: GenMBVoice._bytesToBase64(new Uint8Array(buf)), mimeType: audio.type || 'audio/wav', ...extras }
    }
    throw new Error('Unsupported audio type')
  }
  static _bytesToBase64(bytes) {
    let binary = ''
    const chunk = 0x8000
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk))
    }
    return btoa(binary)
  }
  async _post(path, body) {
    const res = await fetch(this.baseUrl + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(body) })
    const json = await res.json()
    if (!res.ok) throw Object.assign(new Error(json.error || 'voice failed'), { code: json.code })
    if (json && json.success === false) throw Object.assign(new Error(json.error || 'voice failed'), { code: json.code })
    return json.data !== undefined ? json.data : json
  }
}
window.GenMBVoice = GenMBVoice

// GenMB rbac SDK (Capability)
(function() {
class GenMBRBAC {
  constructor({ appId }) {
    if (!appId) {
      throw new Error('GenMBRBAC: appId is required')
    }

    this.appId = appId
    this._role = null
    this._permissions = []
    this._listeners = []
    this._ready = false
    this._readyPromise = null
    this._roleLoader = null
    this._unsubscribeAuth = null
  }

  setRoleLoader(loader) {
    this._roleLoader = loader
  }

  async ready() {
    if (this._ready) return this
    if (this._readyPromise) return this._readyPromise

    this._readyPromise = (async () => {
      try {
        if (window.genmb && window.genmb.auth) {
          await window.genmb.auth.ready()

          this._unsubscribeAuth = window.genmb.auth.onAuthStateChange(async (user) => {
            if (user && this._roleLoader) {
              await this._loadRole(user)
            } else {
              this._role = null
              this._permissions = []
              this._notifyListeners()
            }
          })
        }
      } catch (err) {
        console.error('GenMBRBAC: Error during initialization:', err)
      }

      this._ready = true
      return this
    })()

    return this._readyPromise
  }

  async _loadRole(user, retried = false) {
    try {
      const result = await this._roleLoader(user)
      if (result && result.role) {
        this._role = result.role
        this._permissions = result.permissions || []
        this._notifyListeners()
      }
    } catch (err) {
      if (!retried) {
        await new Promise((resolve) => setTimeout(resolve, 1000))
        return this._loadRole(user, true)
      }
      console.warn('GenMBRBAC: Could not load role, using the default:', err)
    }
  }

  setRole(role, permissions) {
    if (typeof role !== 'string') {
      console.error('GenMBRBAC: role must be a string')
      return
    }
    this._role = role
    this._permissions = Array.isArray(permissions) ? permissions : []
    this._notifyListeners()
  }

  clearRole() {
    this._role = null
    this._permissions = []
    this._notifyListeners()
  }

  getRole() {
    return this._role
  }

  getRolePermissions() {
    return this._permissions.slice()
  }

  hasRole(role) {
    return this._role === role
  }

  hasPermission(permission) {
    return this._permissions.includes('*') || this._permissions.includes(permission)
  }

  isAdmin() {
    return this._role === 'admin'
  }

  requireRole(role) {
    if (this._role !== role) {
      throw new Error('Access denied: requires role "' + role + '"')
    }
  }

  requirePermission(permission) {
    if (!this.hasPermission(permission)) {
      throw new Error('Access denied: requires permission "' + permission + '"')
    }
  }

  onRoleChange(callback) {
    this._listeners.push(callback)
    callback(this._role, this._permissions)
    return () => {
      this._listeners = this._listeners.filter(l => l !== callback)
    }
  }

  _notifyListeners() {
    this._listeners.forEach(listener => {
      try {
        listener(this._role, this._permissions)
      } catch (err) {
        console.error('GenMBRBAC: Error in role change listener:', err)
      }
    })
  }
}

if (typeof window !== 'undefined') {
  window.GenMBRBAC = GenMBRBAC;
}
